name: Feature request
description: A metric, adapter or option you would like.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to check or fix in your RAG system?
    validations: {required: true}
  - type: textarea
    id: idea
    attributes:
      label: What would you like goldpass to do?
      description: If it is a metric, how is it computed, and does it need an LLM?
