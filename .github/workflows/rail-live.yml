name: rail-live

# Gates the LIVE rail-regulation-rag demo with goldpass. Manual only: each run asks the demo 20
# questions (about 5 minutes at its 5-per-minute limit) and uses its free LLM quota.
# The demo's API returns no retrieved passages, so only grounding and answer/refusal rates
# are gated (see examples/rail/live.yaml).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rail-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Gate the live demo
        id: live
        uses: ./
        with:
          config: examples/rail/live.yaml

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rail-live-results
          path: examples/rail/goldpass-results/
