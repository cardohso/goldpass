[project]
name = "goldpass"
version = "0.2.0"
description = "Regression tests for RAG systems: a golden set, deterministic retrieval and grounding metrics, and a CI gate."
readme = "README.md"
license = "MIT"
authors = [{ name = "João Pedro Cardoso" }]
requires-python = ">=3.11"
keywords = ["rag", "evaluation", "llm", "ci", "regression-testing", "github-actions"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
]

[project.urls]
Source = "https://github.com/cardohso/goldpass"
Changelog = "https://github.com/cardohso/goldpass/blob/main/CHANGELOG.md"

[project.scripts]
goldpass = "goldpass.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goldpass"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"docs/images/render_report.py" = ["E501"]  # CSS and a shell command read better unwrapped

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.coverage.run]
source = ["goldpass"]
omit = ["src/goldpass/__main__.py"]  # exercised through a subprocess test, which is not measured

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
